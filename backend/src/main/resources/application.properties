server.port=8080
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/MQP
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security Configurations
mediqueue.jwt.secret=9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
mediqueue.jwt.expiration-ms=86400000

# CORS Allowed Origins
mediqueue.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Logging Level
logging.level.com.mediqueue.pro=INFO
logging.level.org.springframework.security=WARN
